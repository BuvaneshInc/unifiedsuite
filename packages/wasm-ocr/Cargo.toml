
[package]
name = "foundry-ocr-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
image = { version = "0.5", features = ["jpeg","png"] }
onnxruntime = { version = "0.3", features = ["wasm"] }

[profile.release]
opt-level = 3
lto = true
